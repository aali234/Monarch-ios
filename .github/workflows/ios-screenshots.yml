name: iOS build and screenshots

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  screenshots:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26
        shell: bash
        run: |
          xcode_path="$(python3 - <<'PY'
          import pathlib, re
          choices = []
          for path in pathlib.Path('/Applications').glob('Xcode_26*.app'):
              match = re.fullmatch(r'Xcode_(26(?:\.\d+)*)\.app', path.name)
              if match:
                  choices.append((tuple(map(int, match.group(1).split('.'))), str(path)))
          if not choices:
              raise SystemExit('This runner image needs a stable Xcode 26 installation.')
          print(max(choices)[1])
          PY
          )"
          sudo xcode-select --switch "$xcode_path/Contents/Developer"
          xcodebuild -version
      - name: Compile, launch iPhone simulator, and capture UI
        shell: bash
        run: ./scripts/capture-ios-screenshots.sh
      - name: Upload PNG screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iPhone-UI-screenshots
          path: build/Screenshots/
          if-no-files-found: warn
          retention-days: 7
      - name: Upload build log and Xcode results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iOS-build-results
          path: |
            build/ios-screenshots.log
            build/Screenshots.xcresult/
            build/simulator-environment.txt
          if-no-files-found: warn
          retention-days: 3
