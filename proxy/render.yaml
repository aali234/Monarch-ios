services:
  - type: web
    name: monarch-plaid-proxy
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT --no-access-log --no-proxy-headers
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: PLAID_ENV
        value: sandbox
      - key: ENABLE_SANDBOX_TOOLS
        value: true
      - key: PLAID_CLIENT_ID
        sync: false
      - key: PLAID_SECRET
        sync: false
      - key: APP_KEY
        generateValue: true
      - key: SHIP24_API_KEY
        sync: false
